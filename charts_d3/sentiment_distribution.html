<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sentiment distribution</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="chart_config.js"></script>
<script src="chart_data.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; }
  #stage { position: relative; width: 100vw; aspect-ratio: 16 / 9; background: #ffffff;
           font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif; }
  svg { display: block; width: 100%; height: 100%; }
  text { font-family: "Inter", sans-serif; }
</style>
</head>
<body>
<div id="stage">
  <svg id="chart" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet"></svg>
</div>

<script>
const C = CHART_COLORS;
// Data: kernel densities of per-message VADER compound scores (gaussian,
// area-normalised). Two facets, one per person: what I sent vs what they sent.
const DATA = CHART_DATA.sentiment;
if (!DATA) document.body.innerHTML = "<p style='font:20px sans-serif;padding:2em'>No sentiment data — run 6_score_sentiment.py, then 7_prepare_chart_data.py.</p>";

// Palette — the parent who SENT the message gets the project's fixed Paul Tol
// person colour (Mum red / Dad blue); my own messages are a neutral grey in both
// panels, so each parent's tone reads against my flat grey baseline.
const PERSON = Object.fromEntries(CHART_DATA.people.map(p => [p.label, C[p.key]]));
const GREY = C.muted;
const colourFor = (person, dir) => (dir === "sent" ? GREY : PERSON[person]);

// ---- Canvas geometry: 16:9 with equal margins (matches the sibling charts) --
const W = 1920, H = 1080, M = 90;
const inner = { x: M, y: M, w: W - 2 * M, h: H - 2 * M };
const svg = d3.select("#chart");

// Thin canvas outline (frame reference).
svg.append("rect").attr("x", 1).attr("y", 1).attr("width", W - 2).attr("height", H - 2)
  .attr("fill", "none").attr("stroke", C.frame).attr("stroke-width", 2);

// ---- Sub-layout: title block → two stacked facets → x-axis -----------------
const titleH   = 184;   // title + subtitle block (with breathing room below subtitle)
const xLabelH  = 60;    // single row of axis words under the bottom facet
const panelGap = 64;    // space between the Mum and Dad facets

const plot = {
  x: inner.x,
  y: inner.y + titleH,
  w: inner.w,
  h: inner.h - titleH - xLabelH,
};
const panelH = (plot.h - panelGap) / 2;

// Shared scales — facets are FIXED (same x and y across both panels), so the
// curve heights are directly comparable between Mum and Dad.
const x = d3.scaleLinear().domain([-1.02, 1.02]).range([plot.x, plot.x + plot.w]);
const y = d3.scaleLinear().domain([0, DATA.ymax * 1.05]);   // .range set per panel

// Clip curves to the plot column (data runs slightly past ±1; the panel shows ±1.02).
svg.append("defs").append("clipPath").attr("id", "plotclip")
  .append("rect").attr("x", plot.x).attr("y", plot.y)
  .attr("width", plot.w).attr("height", plot.h);

// ---- Title & subtitle (flush-left with the plot, matching the bar charts) ---
svg.append("text")
  .attr("x", plot.x).attr("y", inner.y + 46)
  .attr("font-size", 52).attr("font-weight", 600).attr("fill", C.ink)
  .text("Sentiment analysis");

svg.append("text")
  .attr("x", plot.x).attr("y", inner.y + 96)
  .attr("font-size", 28).attr("font-weight", 500).attr("fill", C.muted)
  .text("Distribution of every message");

// ---- Legend (top-right of the inner region, built right-to-left) ------------
const legend = svg.append("g");
const legItems = [
  { label: "I sent", color: GREY },
  ...CHART_DATA.people.map(p => ({ label: `${p.label} sent`, color: PERSON[p.label] })),
];
const legBaseY = inner.y + 40, sw = 26, swGap = 12, itemGap = 40;
let cursor = inner.x + inner.w;
legItems.slice().reverse().forEach(it => {
  const t = legend.append("text")
    .attr("font-size", 26).attr("font-weight", 500).attr("fill", C.ink)
    .text(it.label);
  const tw = t.node().getBBox().width;
  const left = cursor - (sw + swGap + tw);
  t.attr("x", left + sw + swGap).attr("y", legBaseY);
  legend.append("rect")
    .attr("x", left).attr("y", legBaseY - 22).attr("width", sw).attr("height", sw)
    .attr("fill", it.color);
  cursor = left - itemGap;
});

// ---- Draw one facet (person) -----------------------------------------------
// Pair each x with its density value for a given direction within a panel.
const series = (panel, dir) => DATA.x.map((xv, i) => ({ x: xv, v: panel[dir].y[i] }));

function drawPanel(person, top) {
  const bottom = top + panelH;
  y.range([bottom, top]);
  const panel = DATA.panels[person];

  const area = d3.area().x(d => x(d.x)).y0(y(0)).y1(d => y(d.v)).curve(d3.curveLinear);
  const line = d3.line().x(d => x(d.x)).y(d => y(d.v)).curve(d3.curveLinear);

  const g = svg.append("g").attr("clip-path", "url(#plotclip)");

  // grey "I sent" laid down first; the coloured parent curve sits on top.
  // translucent fills first, then crisp strokes on top of both
  ["sent", "received"].forEach(dir => {
    g.append("path").datum(series(panel, dir))
      .attr("fill", colourFor(person, dir)).attr("fill-opacity", 0.22).attr("d", area);
  });
  ["sent", "received"].forEach(dir => {
    g.append("path").datum(series(panel, dir))
      .attr("fill", "none").attr("stroke", colourFor(person, dir)).attr("stroke-width", 2.6).attr("d", line);
  });

  // solid neutral reference line at 0, drawn over the curves
  svg.append("line")
    .attr("x1", x(0)).attr("x2", x(0)).attr("y1", bottom).attr("y2", top)
    .attr("stroke", C.ink).attr("stroke-width", 1.6);

  // solid baseline (zero density), drawn last so it sits on top
  svg.append("line")
    .attr("x1", plot.x).attr("x2", plot.x + plot.w).attr("y1", bottom).attr("y2", bottom)
    .attr("stroke", C.ink).attr("stroke-width", 2.5);

  // facet strip label, top-left above the panel (matches the sibling charts'
  // person labels)
  svg.append("text")
    .attr("x", plot.x).attr("y", top - 12)
    .attr("font-size", 26).attr("font-weight", 500).attr("fill", C.ink)
    .text(person);
}

drawPanel(CHART_DATA.people[0].label, plot.y);
drawPanel(CHART_DATA.people[1].label, plot.y + panelH + panelGap);

// ---- Shared x-axis under the bottom facet — just the sense of the scale -----
// No ticks or numbers: the neutral line anchors the middle, words mark the ends.
const xBottom = plot.y + plot.h;
const axisY = xBottom + 44;
[
  { text: "More negative", x: plot.x,            anchor: "start"  },
  { text: "Neutral",       x: x(0),              anchor: "middle" },
  { text: "More positive", x: plot.x + plot.w,   anchor: "end"    },
].forEach(l => {
  svg.append("text")
    .attr("x", l.x).attr("y", axisY).attr("text-anchor", l.anchor)
    .attr("font-size", 26).attr("font-weight", 400).attr("fill", C.muted)
    .text(l.text);
});
</script>
</body>
</html>
